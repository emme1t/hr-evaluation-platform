<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><title>{{ title }}</title></head>
<body>
<h1>{{ title }}</h1>
{% if source %}<p>当前版本：{{ source.version }}。保存不会修改该版本，而会创建下一版本。</p>{% endif %}
<form method="post">
{% csrf_token %}
<input type="hidden" name="mutation_key" value="{{ mutation_key }}">
{{ form.non_field_errors }}
{{ form.as_p }}
{{ formset.management_form }}
{% for item_form in formset %}
<fieldset>
<legend>评价项 {{ forloop.counter }}</legend>
{{ item_form.as_p }}
</fieldset>
{% endfor %}
<button type="submit">保存为新版本</button>
</form>
<p><a href="{% url 'evaluations:template-list' %}">返回模板列表</a></p>
</body></html>
